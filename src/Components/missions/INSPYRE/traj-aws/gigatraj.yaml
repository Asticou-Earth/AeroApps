# ------------
# Trajectories
# ------------
Parcels:

  Number: 2500
  Radius_km: 50
  Vertical: PAlt
  Vunits: km
  Vdelta_km: 1
  Format: "%o %a %v"
  
Trajectories: 

  DryRun: False
  #MaxConcurrent: 14
  MaxConcurrent: 14

  #Duration_days: 8 
  Duration_days: 3 
  Timestep_min: 15
  
  ForecastCycle: "20260903_00" # e.g. "20260901_00" if today, today at 0Z
  MetSource: MetGEOSfp 
  #MetSource: MetIFS
  VTrace: P
  outFreq_hour: 1
  OutFormat: "%t %T %i %o %a %v %{PAlt}m"
  
  Releases:
    
    - Start: 2026-09-04T00:00:00
      Fires: 
        - Sinlahekin

    #- Start: 2026-09-02T10:00:00
    #  Fires: 
    #    - Siberia_003

Plots:
    CampaignFile: inspyre.yaml    
    Density_timestep_hours: 44    # 179, hours from start for density plots
    Satellites: [EarthCARE,]
    Image_dpi: 100
    BoundingBox: north_america2 # [east, west, south, north] or siberia, north_america
    
